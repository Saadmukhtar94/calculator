<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">    
  </head>
  <body>
    <h1>Basic Calculator</h1>
    <form id="calculator" class="form-control w-50 d-flex gap-4">
      <!-- <label for="value#1">Value #1</label> -->
      <input type="number" required id="number1"  placeholder="value#1" class="form-control w-50"/>     
      <!-- <label for="value#2">Value #2</label> -->
      <input type="number" required id="number2" placeholder="value#2" class="form-control w-50"/>
      <div id="btns " class="d-flex gap-3">
        <button id="sum" type="button" class="btn btn-outline-primary"><i class="fa-solid fa-plus"></i></button>
      <button id="subtract" type="button" class="btn btn-outline-primary"><i class="fa-solid fa-minus"></i></button>
      <button id="multiply" type="button" class="btn btn-outline-primary"><i class="fa-solid fa-xmark"></i></button>
      <button id="divide" type="button" class="btn btn-outline-primary"><i class="fa-solid fa-divide"></i></button>
      </div>

      <div id="result" class="form-control w-50 border-0"></div>
      <input type="reset" id="reset" class="btn btn-outline-danger">

    </form>
    <script src="jquery/jquery.js"></script>
    <script src="javascript.js">
    
    </script>
  </body>
</html>
